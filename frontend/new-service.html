<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Service - Fluffy Spork</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">Fluffy Spork</div>
            <button class="navbar-toggler" id="navbar-toggler" aria-label="Toggle navigation">
                <span class="toggler-icon"></span>
                <span class="toggler-icon"></span>
                <span class="toggler-icon"></span>
            </button>
            <ul class="navbar-nav" id="navbar-nav">
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="services.html" class="nav-link">Services</a></li>
                <li><a href="new-service.html" class="nav-link active">New Service</a></li>
                <li><a href="profile.html" class="nav-link">Profile</a></li>
                <li><a href="#" id="logout-btn" class="nav-link">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content container">
        <h1>Create New Service</h1>

        <div id="service-alert" class="alert"></div>

        <div class="card">
            <form id="service-form">
                <div class="form-group">
                    <label for="base_url">Base URL</label>
                    <input type="url" id="base_url" class="form-control" required
                           placeholder="https://my-app.onrender.com">
                    <small class="text-muted">Root URL of the service (without path)</small>
                </div>

                <div class="form-group">
                    <label for="endpoints">Endpoints</label>
                    <input type="text" id="endpoints" class="form-control"
                           value="/health" placeholder="/health, /, /api">
                    <small class="text-muted">Comma-separated paths to ping (e.g. /health, /, /docs)</small>
                </div>

                <div class="form-group">
                    <label for="interval">Check Interval</label>
                    <select id="interval" class="form-control">
                        <option value="5">Every 5 minutes</option>
                        <option value="10">Every 10 minutes</option>
                        <option value="14" selected>Every 14 minutes (recommended)</option>
                        <option value="15">Every 15 minutes</option>
                        <option value="30">Every 30 minutes</option>
                        <option value="60">Every 1 hour</option>
                    </select>
                </div>

                <div class="flex gap-2 mt-3">
                    <button type="button" id="test-btn" class="btn btn-outline">Test Now</button>
                    <button type="submit" id="save-btn" class="btn btn-primary">Create Service</button>
                </div>
            </form>
        </div>

        <!-- Test Results Area -->
        <div id="test-results" class="card mt-3" style="display: none;">
            <h3>Test Results</h3>
            <div id="test-content" class="mt-2"></div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Auth.requireAuth();

            const form = document.getElementById('service-form');
            const testResults = document.getElementById('test-results');
            const testContent = document.getElementById('test-content');

            function getPayload() {
                const baseUrl = document.getElementById('base_url').value.trim();
                const endpointsRaw = document.getElementById('endpoints').value.trim();
                const endpoints = endpointsRaw
                    ? endpointsRaw.split(',').map(e => e.trim()).filter(Boolean)
                    : ['/health'];
                const intervalMinutes = parseInt(document.getElementById('interval').value, 10);

                return {
                    base_url: baseUrl,
                    endpoints: endpoints,
                    interval_minutes: intervalMinutes
                };
            }

            // ---- Create Service ----
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                App.hideAlert('service-alert');

                const payload = getPayload();
                if (!payload.base_url) {
                    App.showAlert('service-alert', 'Base URL is required', 'error');
                    return;
                }

                App.setLoading('save-btn', true, 'Create Service');

                try {
                    await ApiClient.post('/services', payload);
                    window.location.href = 'services.html';
                } catch (error) {
                    App.showAlert('service-alert', error.message, 'error');
                } finally {
                    App.setLoading('save-btn', false, 'Create Service');
                }
            });

            // ---- Test Before Create ----
            document.getElementById('test-btn').addEventListener('click', async () => {
                App.hideAlert('service-alert');

                const payload = getPayload();
                if (!payload.base_url) {
                    App.showAlert('service-alert', 'Enter a Base URL before testing', 'error');
                    return;
                }

                App.setLoading('test-btn', true, 'Test Now');
                testResults.style.display = 'none';

                try {
                    const data = await ApiClient.post('/test', {
                        base_url: payload.base_url,
                        endpoints: payload.endpoints
                    });

                    // Render results
                    let html = '<div class="table-responsive"><table class="table"><thead><tr>'
                        + '<th>Endpoint</th><th>Status</th><th>Time</th><th>Result</th>'
                        + '</tr></thead><tbody>';

                    (data.results || []).forEach(r => {
                        const ok = r.success && r.status_code && r.status_code < 400;
                        const badge = ok
                            ? '<span class="badge badge-success">OK</span>'
                            : '<span class="badge badge-error">FAIL</span>';
                        html += `<tr>
                            <td><code>${r.endpoint || '/'}</code><br><small>${r.url || ''}</small></td>
                            <td>${r.status_code ?? '—'}</td>
                            <td>${r.response_time_ms} ms</td>
                            <td>${badge}${r.error ? '<br><small class="text-muted">' + r.error + '</small>' : ''}</td>
                        </tr>`;
                    });

                    html += '</tbody></table></div>';
                    testContent.innerHTML = html;
                    testResults.style.display = 'block';
                } catch (error) {
                    App.showAlert('service-alert', error.message, 'error');
                } finally {
                    App.setLoading('test-btn', false, 'Test Now');
                }
            });
        });
    </script>
</body>
</html>
