<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Fluffy Spork</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">Fluffy Spork</div>
            <button class="navbar-toggler" id="navbar-toggler" aria-label="Toggle navigation">
                <span class="toggler-icon"></span>
                <span class="toggler-icon"></span>
                <span class="toggler-icon"></span>
            </button>
            <ul class="navbar-nav" id="navbar-nav">
                <li><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
                <li><a href="services.html" class="nav-link">Services</a></li>
                <li><a href="new-service.html" class="nav-link">New Service</a></li>
                <li><a href="profile.html" class="nav-link">Profile</a></li>
                <li><a href="#" id="logout-btn" class="nav-link">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content container">
        <div class="flex justify-between align-center mb-3">
            <h1>Dashboard</h1>
            <a href="new-service.html" class="btn btn-primary">Add New Service</a>
        </div>

        <div id="dashboard-alert" class="alert"></div>

        <div class="dashboard-grid mb-3">
            <div class="card">
                <h3>Total Services</h3>
                <h1 id="stat-total" class="mt-1">...</h1>
            </div>
            <div class="card">
                <h3>Success Rate (24h)</h3>
                <h1 id="stat-success" class="mt-1">...</h1>
            </div>
            <div class="card">
                <h3>Active Services</h3>
                <h1 id="stat-active" class="mt-1">...</h1>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Recent History</h2>
                <button class="btn btn-sm btn-outline" id="refresh-history">Refresh</button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Service</th>
                            <th>Status</th>
                            <th>Duration</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body">
                        <tr>
                            <td colspan="4" class="text-center">Loading history...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="pagination-controls" class="flex justify-center gap-1 mt-2 mb-2"></div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            Auth.requireAuth();
            
            let allHistory = [];
            let servicesList = [];
            let currentPage = 1;
            const itemsPerPage = 5;

            const renderHistory = () => {
                const tbody = document.getElementById('history-table-body');
                const paginationControls = document.getElementById('pagination-controls');
                
                if (allHistory.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No history available yet.</td></tr>';
                    paginationControls.innerHTML = '';
                    return;
                }

                const totalPages = Math.ceil(allHistory.length / itemsPerPage);
                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;

                const startIndex = (currentPage - 1) * itemsPerPage;
                const pageHistory = allHistory.slice(startIndex, startIndex + itemsPerPage);

                tbody.innerHTML = pageHistory.map(h => {
                    const statusBadge = h.success
                        ? '<span class="badge badge-success">Success</span>'
                        : '<span class="badge badge-error">Failed</span>';

                    const service = servicesList.find(s => s.id === h.service_id);
                    const serviceName = service ? service.base_url : `Service #${h.service_id}`;

                    return `
                        <tr>
                            <td>${App.formatDate(h.timestamp)}</td>
                            <td>${App.escapeHtml(serviceName)}</td>
                            <td>${statusBadge}</td>
                            <td>${h.response_time_ms ? h.response_time_ms + ' ms' : '-'}</td>
                        </tr>
                    `;
                }).join('');

                renderPaginationControls(totalPages);
            };

            const renderPaginationControls = (totalPages) => {
                const container = document.getElementById('pagination-controls');
                if (totalPages <= 1) {
                    container.innerHTML = '';
                    return;
                }

                let html = `<button class="btn btn-sm btn-outline" onclick="window.changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>◀</button>`;
                
                for (let i = 1; i <= totalPages; i++) {
                    const activeClass = i === currentPage ? 'btn-primary' : 'btn-outline';
                    html += `<button class="btn btn-sm ${activeClass}" onclick="window.changePage(${i})">${i}</button>`;
                }
                
                html += `<button class="btn btn-sm btn-outline" onclick="window.changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>▶</button>`;
                
                container.innerHTML = html;
            };

            window.changePage = (newPage) => {
                const totalPages = Math.ceil(allHistory.length / itemsPerPage);
                if (newPage >= 1 && newPage <= totalPages) {
                    currentPage = newPage;
                    renderHistory();
                }
            };

            const loadDashboard = async () => {
                try {
                    // Fetch services
                    servicesList = await ApiClient.get('/services');
                    document.getElementById('stat-total').textContent = servicesList.length;
                    // All stored services are considered active
                    const activeCount = servicesList.length;
                    document.getElementById('stat-active').textContent = activeCount;

                    // Fetch history
                    const rawHistory = await ApiClient.get('/history?limit=50');
                    // Enforce maximum of 50 items (10 pages max)
                    allHistory = rawHistory.slice(0, 50);
                    
                    if (allHistory.length > 0) {
                        // Calculate basic success rate from recent history
                        const successful = allHistory.filter(h => h.success).length;
                        const rate = Math.round((successful / allHistory.length) * 100);
                        document.getElementById('stat-success').textContent = `${rate}%`;
                    } else {
                        document.getElementById('stat-success').textContent = 'N/A';
                    }
                    
                    currentPage = 1;
                    renderHistory();
                } catch (error) {
                    App.showAlert('dashboard-alert', 'Failed to load dashboard data: ' + error.message, 'error');
                }
            };

            await loadDashboard();

            document.getElementById('refresh-history').addEventListener('click', async (e) => {
                const btn = e.target;
                btn.disabled = true;
                btn.textContent = 'Refreshing...';
                await loadDashboard();
                btn.textContent = 'Refresh';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
