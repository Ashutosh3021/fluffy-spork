<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - Fluffy Spork</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">Fluffy Spork</div>
            <button class="navbar-toggler" id="navbar-toggler" aria-label="Toggle navigation">
                <span class="toggler-icon"></span>
                <span class="toggler-icon"></span>
                <span class="toggler-icon"></span>
            </button>
            <ul class="navbar-nav" id="navbar-nav">
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="services.html" class="nav-link active">Services</a></li>
                <li><a href="new-service.html" class="nav-link">New Service</a></li>
                <li><a href="profile.html" class="nav-link">Profile</a></li>
                <li><a href="#" id="logout-btn" class="nav-link">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content container">
        <div class="flex justify-between align-center mb-3">
            <h1>My Services</h1>
            <a href="new-service.html" class="btn btn-primary">Add New Service</a>
        </div>

        <div id="services-alert" class="alert"></div>

        <div class="card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Name / URL</th>
                            <th>Method</th>
                            <th>Interval</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="services-table-body">
                        <tr>
                            <td colspan="5" class="text-center">Loading services...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Action results overlay / modal could go here, for now using alert -->
    </main>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            Auth.requireAuth();
            const tbody = document.getElementById('services-table-body');

            const loadServices = async () => {
                try {
                    const services = await ApiClient.get('/services');

                    if (services.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No services found. Create one!</td></tr>';
                        return;
                    }

                    tbody.innerHTML = services.map(s => `
                        <tr>
                            <td>
                                <strong>${App.escapeHtml(s.name)}</strong><br>
                                <small class="text-muted">${App.escapeHtml(s.url)}</small>
                            </td>
                            <td><span class="badge badge-muted">${App.escapeHtml(s.method)}</span></td>
                            <td>${s.interval_minutes}m</td>
                            <td>${s.active ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-muted">Paused</span>'}</td>
                            <td>
                                <div class="flex gap-1">
                                    <button class="btn btn-sm btn-outline test-btn" data-id="${s.id}">Test</button>
                                    <button class="btn btn-sm btn-outline toggle-btn" data-id="${s.id}" data-active="${s.active}">
                                        ${s.active ? 'Pause' : 'Resume'}
                                    </button>
                                    <button class="btn btn-sm btn-danger delete-btn" data-id="${s.id}">Delete</button>
                                </div>
                            </td>
                        </tr>
                    `).join('');

                    attachEventListeners();
                } catch (error) {
                    App.showAlert('services-alert', 'Failed to load services: ' + error.message, 'error');
                }
            };

            const attachEventListeners = () => {
                // Delete
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        if (!confirm('Are you sure you want to delete this service?')) return;

                        const id = e.target.dataset.id;
                        try {
                            await ApiClient.delete(`/services/${id}`);
                            App.showAlert('services-alert', 'Service deleted successfully.', 'success');
                            loadServices();
                        } catch (error) {
                            App.showAlert('services-alert', 'Delete failed: ' + error.message, 'error');
                        }
                    });
                });

                // Toggle active state
                document.querySelectorAll('.toggle-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.dataset.id;
                        const currentlyActive = e.target.dataset.active === 'true';
                        try {
                            await ApiClient.put(`/services/${id}`, { active: !currentlyActive });
                            loadServices();
                        } catch (error) {
                            App.showAlert('services-alert', 'Update failed: ' + error.message, 'error');
                        }
                    });
                });

                // Test
                document.querySelectorAll('.test-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.dataset.id;
                        const originalText = e.target.textContent;
                        e.target.textContent = 'Testing...';
                        e.target.disabled = true;

                        try {
                            const result = await ApiClient.post(`/services/${id}/test`, {});
                            if (result.status === 'success') {
                                App.showAlert('services-alert', `Test passed in ${result.duration_ms}ms`, 'success');
                            } else {
                                App.showAlert('services-alert', `Test failed: HTTP ${result.status_code || 'Unknown'}`, 'error');
                            }
                        } catch (error) {
                            App.showAlert('services-alert', 'Test failed: ' + error.message, 'error');
                        } finally {
                            e.target.textContent = originalText;
                            e.target.disabled = false;
                        }
                    });
                });
            };

            await loadServices();
        });
    </script>
</body>
</html>
