<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services - Fluffy Spork</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">Fluffy Spork</div>
            <button class="navbar-toggler" id="navbar-toggler" aria-label="Toggle navigation">
                <span class="toggler-icon"></span>
                <span class="toggler-icon"></span>
                <span class="toggler-icon"></span>
            </button>
            <ul class="navbar-nav" id="navbar-nav">
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="services.html" class="nav-link active">Services</a></li>
                <li><a href="new-service.html" class="nav-link">New Service</a></li>
                <li><a href="profile.html" class="nav-link">Profile</a></li>
                <li><a href="#" id="logout-btn" class="nav-link">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content container">
        <div class="flex justify-between align-center mb-3">
            <h1>My Services</h1>
            <a href="new-service.html" class="btn btn-primary">Add New Service</a>
        </div>

        <div id="services-alert" class="alert"></div>

        <div class="card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>URL / Endpoints</th>
                            <th>Interval</th>
                            <th>Last Ping</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="services-table-body">
                        <tr>
                            <td colspan="4" class="text-center">Loading services...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            Auth.requireAuth();
            const tbody = document.getElementById('services-table-body');

            function formatInterval(seconds) {
                if (!seconds && seconds !== 0) return '—';
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                if (m > 0 && s > 0) return `${m}m ${s}s`;
                if (m > 0) return `${m} min`;
                return `${s}s`;
            }

            function formatLastPing(ts) {
                if (!ts || ts === 0) return 'Never';
                try {
                    const d = new Date(ts * 1000);
                    if (isNaN(d.getTime())) return 'Never';
                    return d.toLocaleString();
                } catch {
                    return 'Never';
                }
            }

            const loadServices = async () => {
                try {
                    const services = await ApiClient.get('/services');

                    if (!services || services.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No services found. Create one!</td></tr>';
                        return;
                    }

                    tbody.innerHTML = services.map(s => {
                        const endpoints = (s.endpoints || []).join(', ') || '/';
                        return `
                        <tr>
                            <td>
                                <strong>${App.escapeHtml(s.base_url || '—')}</strong><br>
                                <small class="text-muted">${App.escapeHtml(endpoints)}</small>
                            </td>
                            <td>${formatInterval(s.interval_seconds)}</td>
                            <td>${formatLastPing(s.last_pinged_at)}</td>
                            <td>
                                <div class="flex gap-1">
                                    <button class="btn btn-sm btn-outline test-btn" data-id="${s.id}">Test</button>
                                    <button class="btn btn-sm btn-danger delete-btn" data-id="${s.id}">Delete</button>
                                </div>
                            </td>
                        </tr>`;
                    }).join('');

                    attachEventListeners();
                } catch (error) {
                    App.showAlert('services-alert', 'Failed to load services: ' + error.message, 'error');
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Failed to load</td></tr>';
                }
            };

            const attachEventListeners = () => {
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        if (!confirm('Are you sure you want to delete this service?')) return;
                        const id = e.target.dataset.id;
                        try {
                            await ApiClient.delete(`/services/${id}`);
                            App.showAlert('services-alert', 'Service deleted successfully.', 'success');
                            loadServices();
                        } catch (error) {
                            App.showAlert('services-alert', 'Delete failed: ' + error.message, 'error');
                        }
                    });
                });

                document.querySelectorAll('.test-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.dataset.id;
                        const originalText = e.target.textContent;
                        e.target.textContent = 'Testing...';
                        e.target.disabled = true;

                        try {
                            const data = await ApiClient.post(`/services/${id}/test`, {});
                            const results = data.results || [];

                            if (results.length === 0) {
                                App.showAlert('services-alert', 'Test returned no results', 'error');
                            } else {
                                const lines = results.map(r => {
                                    const ok = r.success && r.status_code && r.status_code < 400;
                                    const label = ok ? 'OK' : 'FAIL';
                                    return `${r.endpoint || '/'}: ${label} (HTTP ${r.status_code ?? '—'}, ${r.response_time_ms}ms)${r.error ? ' — ' + r.error : ''}`;
                                });
                                const allOk = results.every(r => r.success && r.status_code && r.status_code < 400);
                                App.showAlert(
                                    'services-alert',
                                    lines.join(' | '),
                                    allOk ? 'success' : 'error'
                                );
                            }
                        } catch (error) {
                            App.showAlert('services-alert', 'Test failed: ' + error.message, 'error');
                        } finally {
                            e.target.textContent = originalText;
                            e.target.disabled = false;
                        }
                    });
                });
            };

            await loadServices();
        });
    </script>
</body>
</html>
